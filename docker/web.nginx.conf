server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The three apps are single page apps with client side routing, so a deep
  # link like /listings/01M0... has no file behind it and must still be
  # answered with the shell. Without this, refreshing any page but the root
  # gives a 404 from nginx rather than the screen the reader was looking at.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed asset names, so they can be cached until the file name changes.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The apps call the api on their own origin, which is what keeps the session
  # cookie first party. In development the vite proxy does this; here nginx
  # does, and neither the client nor the api has to know the difference.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A photograph can be several megabytes and the api caps uploads at eight.
    client_max_body_size 10m;
    proxy_read_timeout 120s;
  }

  # The shell itself must never be cached, or a reader keeps loading yesterday's
  # asset names after a deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
